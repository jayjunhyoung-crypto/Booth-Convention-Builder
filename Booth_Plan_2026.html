        btn.innerText = "🖥️ 하드웨어 숨김";
        btn.style.background = "#8b5cf6";
      } else {
        document.body.classList.add('hide-hw');
        btn.innerText = "🖥️ 하드웨어 보이기";
        btn.style.background = "#f59e0b"; 
      }
    }

    function togglePublicMode() {
      isPublicMode = !isPublicMode;
      const btn = document.getElementById('btn-public-mode');
      if(isPublicMode) {
        document.body.classList.add('public-mode');
        btn.innerText = "🛠️ 관리자 모드 복귀 (색상 켬)";
        btn.style.background = "#f59e0b";
      } else {
        document.body.classList.remove('public-mode');
        btn.innerText = "🗺️ 배포용 도면 (색상/범례 숨김)";
        btn.style.background = "#64748b";
      }
    }

    // 📊 엑셀 커스텀 정렬 내보내기
    function exportToCSV() {
      const headers = isHwVisible 
        ? ['Booth No', 'Country Code', 'Company Name', 'Hardware']
        : ['Booth No', 'Country Code', 'Company Name'];
        
      let csvContent = "\uFEFF" + headers.join(',') + '\n';
      
      const customOrder = [
        "MPTC", "HSITP", "Bioeconomy Corporation", "Global Testbed & Sandbox Alliance (GTSA)", "Malaysia Digital Economy Corporation", "VentureTECH", "Cyberport", "Airwallex", "Turning Point MEA", "Plug and Play APAC", "Plug and Play", "2MR", "AlgoTech", "Alpha Reality", "Alternō", "Autify", "Aware Technology", "BetterData", "Braillic", "BRALCO ADVANCED MATERIALS PTE. LTD.", "Call Me Sensei", "Detail Earth", "Findy Inc.", "FinLuy", "FOOTBOT", "FUNTEK", "GrinBean Hong Kong Limited", "HairCoSys", "HongKe Technology Co., Ltd.", "HOURS Technology", "identi.ly", "Innocorn Technology Limited", "InsightGenie", "Lango Innovation Limited", "Locolla Limited", "meed", "Mind Lab", "MotoNerv AI", "NanoFrontier", "Novelte Robotics", "oneCHARGE Solutions", "Optiqb AI Technology Limited", "PIKA", "Pivota", "Preferrd", "RailMind Technology Limited", "Resaro", "SENGINE AI TECH", "The Robot Company", "Turing Drive Inc.", "VOLTAVATE", "VSL", "WeGen", "Wineworld Xplorer Limited", "Zunya", "YITI TECH Co., Ltd.", "fileAI", "enfarm Agritech", "smart breed", "InstaAgent Company Limited", "Wuxi Baiwanbian Technology Co., Ltd.", "Hanan Medicare", "Recove Group", "Gaia Plas", "Kirana Semikonduktor Sdn. Bhd", "MAIA - Medical Augmented Intelligence Automation", "Tan Lan Agri Venture", "HelloWorld Robotics", "Cell Biopeutics Resources Sdn. Bhd.", "GreenSHeart"
      ];

      let exportRows = [];
      let exportedIds = new Set();

      customOrder.forEach(target => {
        const cleanTarget = target.replace(/[\u200B-\u200D\uFEFF\u2060]/g, '').trim().toLowerCase();
        for (let i = 1; i <= 84; i++) {
          const data = seatData[i];
          if (data && data.c && !exportedIds.has(i)) {
            const cleanName = data.c.replace(/[\u200B-\u200D\uFEFF\u2060]/g, '').trim().toLowerCase();
            if (cleanName === cleanTarget || cleanName.includes(cleanTarget)) {
              exportRows.push({ id: i, data: data });
              exportedIds.add(i);
              break;
            }
          }
        }
      });

      for (let i = 1; i <= 84; i++) {
        if (!exportedIds.has(i) && seatData[i] && seatData[i].c) {
          exportRows.push({ id: i, data: seatData[i] });
        }
      }

      exportRows.forEach(item => {
        let cNameEscaped = item.data.c ? item.data.c.replace(/"/g, '""') : ''; 
        let row = [item.id, item.data.cc, `"${cNameEscaped}"`];
        if(isHwVisible) row.push(`"${item.data.hw || 'Tablet'}"`);
        csvContent += row.join(',') + '\n';
      });
      
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "FloorPlan_Custom_Order.csv";
      link.click();
    }

    function countHardware() {
      let tabletCount = 0;
      let standbyCount = 0;
      for (let i = 1; i <= 84; i++) {
        if(seatData[i] && seatData[i].c) { 
          const hw = seatData[i].hw || 'Tablet';
          if(hw === 'Tablet') tabletCount++;
          else if(hw === 'StandByMe') standbyCount++;
        }
      }
      return { tablet: tabletCount, standby: standbyCount };
    }

    function render() {
      canvas.innerHTML = '';
      
      const legend = document.createElement('div');
      legend.className = 'legend';
      legend.innerHTML = '<div class="legend-title">Categories</div>';
      categories.forEach(cat => {
        legend.innerHTML += `<div class="legend-item"><div class="legend-color" style="background:${cat.color}"></div>${cat.name}</div>`;
      });
      canvas.appendChild(legend);

      const hwCounts = countHardware();
      const dashboard = document.createElement('div');
      dashboard.className = 'hw-dashboard';
      dashboard.innerHTML = `
        <div class="hw-dashboard-title">Hardware Status</div>
        <div class="hw-item"><span>StandByMe</span><div class="hw-count">${hwCounts.standby}</div></div>
        <div class="hw-item"><span>Tablet</span><div class="hw-count">${hwCounts.tablet}</div></div>
        <div class="hw-item hw-total"><span>Total Devices</span><div class="hw-count">${hwCounts.standby + hwCounts.tablet}</div></div>
      `;
      canvas.appendChild(dashboard);

      const pos = ['pos-left', 'pos-top', 'pos-right', 'pos-bottom'];
      const lpos = ['label-left', 'label-top', 'label-right', 'label-bottom'];

      layouts.forEach(grp => {
        const gDiv = document.createElement('div');
        gDiv.className = 'table-group';
        gDiv.style.left = grp.x + 'px'; gDiv.style.top = grp.y + 'px';
        
        const partition = document.createElement('div');
        partition.className = 'partition';
        gDiv.appendChild(partition);

        grp.seats.forEach((id, idx) => {
          const data = seatData[id];
          const sDiv = document.createElement('div');
          sDiv.className = `seat ${pos[idx]}`;
          sDiv.style.backgroundColor = data.col;
          
          sDiv.innerHTML = `<div class="seat-inner">${id}</div>`;
          
          sDiv.setAttribute('draggable', 'true');
          sDiv.addEventListener('mousedown', (e) => e.stopPropagation()); 
          
          sDiv.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', id); e.stopPropagation(); });
          sDiv.addEventListener('dragover', (e) => { e.preventDefault(); sDiv.classList.add('drag-over'); });
          sDiv.addEventListener('dragleave', (e) => { sDiv.classList.remove('drag-over'); });
          sDiv.addEventListener('drop', (e) => {
            e.preventDefault();
            sDiv.classList.remove('drag-over');
            const draggedId = e.dataTransfer.getData('text/plain');
            if(draggedId && draggedId != id) {
              const temp = seatData[draggedId];
              seatData[draggedId] = seatData[id];
              seatData[id] = temp;
              save();
            }
          });

          // 부스 단일 클릭으로 팝업 호출
          sDiv.onclick = () => openModal(id);

          if(data.c) {
            const lDiv = document.createElement('div');
            lDiv.className = `label ${lpos[idx]}`;
            
            lDiv.innerHTML = `
              <div class="booth-no-badge">No.${id}</div>
              <img src="https://flagcdn.com/w40/${data.cc.toLowerCase()}.png" onerror="this.style.display='none'"> 
              <div class="label-content">
                <span class="label-cname">${data.c}</span>
                <span class="label-hw">(${data.hw || 'Tablet'})</span>
              </div>
            `;
            gDiv.appendChild(lDiv);
          }
          gDiv.appendChild(sDiv);
        });
        canvas.appendChild(gDiv);
      });
    }

    function updateTransform() {
      canvas.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    viewport.addEventListener('mousedown', (e) => { isPanning = true; startX = e.clientX - translateX; startY = e.clientY - translateY; });
    window.addEventListener('mouseup', () => { isPanning = false; });
    window.addEventListener('mousemove', (e) => { if(!isPanning) return; translateX = e.clientX - startX; translateY = e.clientY - startY; updateTransform(); });
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const xs = (e.clientX - translateX) / scale;
      const ys = (e.clientY - translateY) / scale;
      scale *= e.deltaY > 0 ? 0.9 : 1.1; 
      scale = Math.min(Math.max(0.2, 3), scale); 
      translateX = e.clientX - xs * scale;
      translateY = e.clientY - ys * scale;
      updateTransform();
    }, {passive: false});

    function openModal(id) {
      currentEditId = id;
      const data = seatData[id];
      document.getElementById('modalTitle').innerText = `Edit Booth No.${id}`;
      document.getElementById('editCompany').value = data.c;
      document.getElementById('editCountry').value = data.cc;
      document.getElementById('editHw').value = data.hw || 'Tablet';
      document.getElementById('editCategory').value = data.col;
      document.getElementById('editModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('editModal').style.display = 'none'; }
    function saveModal() {
      seatData[currentEditId].c = document.getElementById('editCompany').value;
      seatData[currentEditId].cc = document.getElementById('editCountry').value;
      seatData[currentEditId].hw = document.getElementById('editHw').value;
      seatData[currentEditId].col = document.getElementById('editCategory').value;
      closeModal(); save();
    }

    function takeScreenshot() {
      const btn = document.querySelector('.btn-capture');
      btn.innerText = "Capturing...";
      const oldT = canvas.style.transform;
      canvas.style.transform = 'none'; 
      
      html2canvas(canvas, { scale: 1.5, useCORS: true, backgroundColor: isPublicMode ? '#ffffff' : '#f8fafc' }).then(c => {
        const link = document.createElement('a');
        let filename = isPublicMode ? 'FloorPlan_Public_2026' : 'FloorPlan_Admin_2026';
        if(!isHwVisible) filename += '_No_HW';
        link.download = filename + '.png';
        
        link.href = c.toDataURL('image/png');
        link.click();
        
        canvas.style.transform = oldT;
        btn.innerText = "📸 플로어 플랜 캡처";
      }).catch(e => {
        canvas.style.transform = oldT;
        alert("Failed to capture screen.");
        btn.innerText = "📸 플로어 플랜 캡처";
      });
    }

    window.onload = init;
  </script>
